<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 Półka z jajkami</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap">
<link rel="stylesheet" href="wspolne.css">
<style>
#root{background:radial-gradient(1100px 600px at 50% 20%,#34261a,#16100b 70%)}
.t{position:absolute;left:44px;top:22px;font-size:44px;color:var(--amber);text-shadow:0 3px 0 var(--outline)}
.shelf{position:absolute;left:44px;right:44px;height:200px}
.shelf .plank{position:absolute;left:-10px;right:-10px;bottom:0;height:26px;border-radius:6px;background:linear-gradient(#8a5a30,#5e3a1c 60%,#3d2410);border-bottom:6px solid #1d1008;box-shadow:0 12px 20px rgba(0,0,0,.55)}
.shelf .plank::after{content:'';position:absolute;left:0;right:0;top:5px;height:3px;background:rgba(255,220,160,.2)}
.eggs{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:space-around;align-items:flex-end;padding:0 10px}
.it{position:relative;width:150px;height:165px;transition:.2s;opacity:.78;transform-origin:50% 100%}
.it .egg-art{width:100%;height:100%}.it:hover{opacity:1;transform:translateY(-6px)}
.it.on{opacity:1;transform:translateY(-16px) scale(1.12);filter:drop-shadow(0 0 22px rgba(255,190,90,.75))}
.it .tag{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:16px;background:#2a1c10;border:2px solid #14100d;border-radius:8px;padding:0 10px;color:var(--muted);z-index:2}
.it.on .tag{background:var(--amber);color:#2b1a12}
.it.lk::after{content:'🔒';position:absolute;left:50%;top:92px;transform:translateX(-50%);font-size:22px}
.draw{position:absolute;left:44px;top:556px;width:700px;height:210px;display:flex;gap:26px;align-items:center;padding:16px 26px;border-radius:22px;border:2px solid var(--line);background:linear-gradient(var(--panel),#1b140f)}
.draw .pic{width:150px;height:165px;flex:none}.draw .pic .egg-art{width:100%;height:100%}
.draw h2{font-size:46px;color:var(--amber);line-height:1}.draw .sub{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:15px;margin:2px 0 8px}
.draw .pks{display:flex;flex-wrap:wrap;gap:6px}.draw .pk{font-size:14px;padding:3px 10px}
.opt{position:absolute;left:768px;right:44px;top:556px;height:210px;display:grid;grid-template-columns:1fr 1.5fr;gap:18px}
.mbox{display:flex;flex-direction:column;gap:10px}
.mode{flex:1;text-align:left;padding:10px 16px;border-radius:16px;border:3px solid var(--outline);background:var(--panel2);opacity:.7}
.mode h3{font-size:28px;line-height:1}.mode span{font-size:13px;color:var(--muted)}.mode.on{opacity:1;border-color:var(--amber);background:#3a2b1c;box-shadow:0 0 20px rgba(255,150,40,.25)}.mode.on h3{color:var(--amber)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bb{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 0 6px;border-radius:14px;border:3px solid var(--outline);background:var(--panel2);color:var(--muted)}
.bb .bart{width:78px;height:62px}.bb b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1}.bb small{font-size:12px}
.bb.on{border-color:var(--c);color:var(--c);background:#3a2b1c;box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}.bb.lk{opacity:.45}
.go{position:absolute;right:44px;bottom:26px}.sum{position:absolute;left:44px;bottom:42px;font-size:20px;color:var(--muted)}.sum b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink)}
.hint{position:absolute;left:0;right:0;top:12px;text-align:center;color:var(--faint);font-size:14px}
</style></head><body><div id="root"></div>
<script type="module">
import {art,D,T,S,CH,GARNEK,MODES,BURNERS,HEAT,MAX_BURNER,egg,bart,perks,mount} from "./wspolne.js";
mount(S=>{ const c=CH[S.cur], g=GARNEK[S.burner], m=MODES[S.mode], ok=c.open&&g.open;
 const sh=(from,to,top)=>`<div class="shelf" style="top:${top}px"><div class="eggs">${CH.slice(from,to).map((x,j)=>{const i=from+j;return `<button class="it ${i===S.cur?'on':''} ${x.open?'':'lk'}" data-set="cur:${i}">${egg(x.id)}<span class="tag">${x.hidden?'???':x.name.replace(/^(Kurczak|Kura|Kogut|Indyczka) /,'')}</span></button>`}).join('')}</div><div class="plank"></div></div>`;
 return `<h1 class="t">Nowy run</h1><div class="hint">← → wybierz jajko z półki</div><button class="back" style="left:auto;right:44px;top:30px">← Menu</button>
 ${sh(0,7,64)}${sh(7,14,300)}
 <section class="draw"><div class="pic">${egg(c.id)}</div><div><h2>${c.name}</h2><div class="sub">${c.style}</div><div class="pks">${c.open?perks(c.id):`<div class="pk"><span>🔒 ${c.hidden?'Zagadka.':c.unlock}</span></div>`}</div></div></section>
 <section class="opt"><div class="mbox">${Object.values(MODES).map(x=>`<button class="mode ${x.id===S.mode?'on':''}" data-set="mode:${x.id}"><h3>${x.name}</h3><span>${x.floors} pięter · ${x.bosses} bossów · ok. ${x.min} min</span></button>`).join('')}</div>
  <div class="bgrid">${GARNEK.map(x=>`<button class="bb ${x.lvl===S.burner?'on':''} ${x.open?'':'lk'}" style="--c:${x.heat}" data-set="burner:${x.lvl}">${bart(x.lvl)}<b>${x.name}${x.open?'':' 🔒'}</b><small>×${x.mult}</small></button>`).join('')}</div></section>
 <div class="sum">${m.name} · <b>${c.name}</b> · <b style="color:${g.heat}">${g.name}</b> · wynik <b style="color:var(--gold)">×${g.mult}</b></div><button class="go" ${ok?'':'disabled'}>Do garnka! →</button>`;});
</script></body></html>
