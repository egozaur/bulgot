<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 Panel windy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Special+Elite&display=swap">
<link rel="stylesheet" href="wspolne.css">
<style>
#root{background:linear-gradient(90deg,#0e0b09 0,#1a1410 30%,#1a1410 70%,#0e0b09 100%)}
.door{position:absolute;top:0;bottom:0;width:230px;background:repeating-linear-gradient(90deg,#3a3f46 0 3px,#2d3138 3px 7px);box-shadow:inset 0 0 60px #000}
.door.l{left:330px;border-right:6px solid #14100d}.door.r{right:330px;border-left:6px solid #14100d}
.cab{position:absolute;left:560px;right:560px;top:0;bottom:0;background:radial-gradient(500px 500px at 50% 55%,#4a3a22,#1b140d 75%)}
.lamp{position:absolute;left:50%;top:0;width:340px;height:640px;margin-left:-170px;background:linear-gradient(rgba(255,230,170,.18),rgba(255,230,170,0));clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
.floor{position:absolute;left:560px;right:560px;top:640px;height:260px;background:linear-gradient(#2a2118,#0e0a07);border-top:4px solid #4a3a2a}
.pane{position:absolute;top:86px;bottom:36px;width:300px;border-radius:26px;border:3px solid #6b6258;background:linear-gradient(135deg,#4a4640,#2a2724 40%,#3a3632);box-shadow:inset 0 0 0 3px #14100d,0 14px 40px #000;padding:20px 22px}
.pane h4{font-size:16px;letter-spacing:.22em;color:#c9bfae;text-transform:uppercase;text-align:center;margin-bottom:12px;font-family:var(--body);font-weight:700}
#pl{left:36px}#pr{right:36px}
.disp{height:92px;border-radius:12px;background:#0b0604;border:3px solid #14100d;box-shadow:inset 0 0 20px #000;text-align:center;font-family:'Special Elite',monospace;color:var(--c);text-shadow:0 0 14px var(--c);margin-bottom:16px;padding-top:8px}
.disp b{display:block;font-size:46px;line-height:1.05}.disp span{font-size:17px;letter-spacing:.1em}
.btns{display:flex;flex-direction:column;gap:11px}
.fb{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.fb i{flex:none;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a8478,#3a3632);border:4px solid #14100d;box-shadow:0 5px 0 #14100d;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-size:30px;color:#14100d;position:relative}
.fb i::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:3px solid transparent}
.fb.on i{background:radial-gradient(circle at 35% 30%,#fff,var(--c));box-shadow:0 5px 0 #14100d,0 0 22px var(--c)}.fb.on i::after{border-color:var(--c)}
.fb.lk i{opacity:.55}
.fb div{font-size:13px;color:#a79d8c;line-height:1.2}.fb div b{display:block;font-family:var(--display);font-weight:400;font-size:21px;color:#e8e0d0}.fb.on div b{color:var(--c)}
.mid{position:absolute;left:560px;right:560px;top:36px;text-align:center}
.mid .t{font-size:34px;color:var(--amber);letter-spacing:.06em}
.big{position:absolute;left:50%;top:104px;width:330px;height:360px;margin-left:-165px;filter:drop-shadow(0 22px 22px #000)}.big .egg-art{width:100%;height:100%}
.mid2{position:absolute;left:560px;right:560px;top:482px;text-align:center}
.mid2 h2{font-size:52px;color:var(--amber);line-height:1}.mid2 .sub{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:16px;margin:2px 0 10px}
.pks{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.pks .pk{font-size:16px;padding:4px 12px}
.mini{position:absolute;left:560px;right:560px;bottom:30px;display:flex;gap:5px;justify-content:center}
.mini button{width:36px;height:40px;border-radius:9px;background:rgba(0,0,0,.4);border:2px solid #14100d;padding:2px;position:relative;opacity:.75}.mini button.on{border-color:var(--amber);opacity:1;box-shadow:0 0 12px var(--amber)}
.mini .egg-art{width:100%;height:100%}.mini .lk::after{content:'🔒';position:absolute;right:-2px;bottom:-4px;font-size:11px}
.nv{position:absolute;top:280px;width:50px;height:90px;border-radius:14px;background:#2d2a26;border:3px solid #14100d;font-size:34px;color:var(--amber)}
.key{position:relative;margin:0 auto;width:210px;height:210px}
.slot{width:100%;display:block;text-align:center;padding:12px 6px;border-radius:14px;background:#14100d;border:3px solid #0b0806;margin-bottom:12px;color:#8a8478;box-shadow:inset 0 0 14px #000}
.slot b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1}.slot span{font-size:13px}
.slot.on{color:var(--amber);border-color:var(--amber);background:#2a1d10;box-shadow:0 0 20px rgba(255,160,40,.35)}
.ladder{display:flex;flex-direction:column-reverse;gap:3px;margin-top:6px;align-items:center}
.ladder i{width:100px;height:9px;border-radius:3px;background:#5a544a}.ladder i.b{background:var(--red);width:130px}.ladder i.off{opacity:.18}
.go{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;white-space:nowrap;font-size:26px;z-index:3}
</style></head><body><div id="root"></div>
<script type="module">
import {art,D,T,S,CH,GARNEK,MODES,BURNERS,HEAT,MAX_BURNER,egg,bart,perks,mount} from "./wspolne.js";
mount(S=>{ const c=CH[S.cur], g=GARNEK[S.burner], m=MODES[S.mode], ok=c.open&&g.open;
 const lad=Array.from({length:20},(_,i)=>`<i class="${m.bf.includes(i+1)?'b':''} ${i+1>m.floors?'off':''}"></i>`).join('');
 return `<div class="door l"></div><div class="door r"></div><div class="cab"></div><div class="lamp"></div><div class="floor"></div>
 <button class="back" style="z-index:6">← Menu</button>
 <section class="mid"><div class="t">NOWY RUN · kabina nr 1</div></section>
 <div class="big">${egg(c.id)}</div><button class="nv" style="left:600px" data-set="cur:${S.cur-1}">‹</button><button class="nv" style="right:600px" data-set="cur:${S.cur+1}">›</button>
 <section class="mid2"><h2>${c.name}</h2><div class="sub">${c.style}</div><div class="pks">${c.open?perks(c.id):`<div class="pk"><span>🔒 ${c.hidden?'Zagadka.':c.unlock}</span></div>`}</div></section>
 <button class="go" ${ok?'':'disabled'}>Zjeżdżamy! →</button>
 <div class="mini">${CH.map((x,i)=>`<button class="${i===S.cur?'on':''} ${x.open?'lk0':'lk'}" data-set="cur:${i}">${egg(x.id)}</button>`).join('')}</div>
 <section class="pane" id="pl" style="--c:${g.heat}"><h4>Poziom palnika</h4>
  <div class="disp"><b>${S.burner}</b><span>${g.name.toUpperCase()}</span></div>
  <div class="btns">${GARNEK.slice().reverse().map(x=>`<button class="fb ${x.lvl===S.burner?'on':''} ${x.open?'':'lk'}" style="--c:${x.heat}" data-set="burner:${x.lvl}"><i>${x.lvl}</i><div><b>${x.name}${x.open?'':' 🔒'}</b>${x.mod} · ×${x.mult}</div></button>`).join('')}</div></section>
 <section class="pane" id="pr" style="--c:var(--amber)"><h4>Tryb · kluczyk</h4><div class="disp" style="--c:var(--amber)"><b>${m.floors}</b><span>PIĘTER · ok. ${m.min} min</span></div>
  ${Object.values(MODES).map(x=>`<button class="slot ${x.id===S.mode?'on':''}" data-set="mode:${x.id}"><b>${x.name}</b><span>${x.floors} pięter · ${x.bosses} bossów · ok. ${x.min} min</span></button>`).join('')}
  <h4 style="margin-top:20px">Wysokość budynku</h4><div class="ladder">${lad}</div>
  <p style="text-align:center;margin:10px 0 0;color:#a79d8c;font-size:13px">czerwone belki = bossowie</p></section>`;});
</script></body></html>
