<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>19 Kroki w ramkach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap">
<link rel="stylesheet" href="wspolne.css"><link rel="stylesheet" href="arc.css">
<style>.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--amber);color:#2b1a12;align-items:center;justify-content:center;font-family:var(--display);font-size:19px;margin-right:10px;letter-spacing:0}
.panel>h4{align-items:center}.panel>h4 span{display:flex;align-items:center}.panel>h4 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--faint)}
.roster .tl{padding-bottom:17px}</style>
</head><body><div id="root"></div>
<script type="module">
import * as K from './komp.js';
const {box,deco,title,back,roster,hero,stats,perksCard,modes,burnList,sumbar,start,mount}=K;
const h=(n,t,e='')=>`<h4><span><i class="num">${n}</i>${t}</span><em>${e}</em></h4>`;
mount(S=>`${deco()}${back('top:22px')}
 ${box('left:0;right:0;top:14px;text-align:center',title('Nowy run','s'))}
 ${box('left:40px;top:80px;width:340px;height:712px','<div class="panel" style="height:100%">'+h(1,'Tryb','↑ ↓')+modes(S)+'<div style="margin-top:18px">'+stats(S,'Bohater')+'</div><div style="margin-top:12px">'+perksCard(S)+'</div></div>')}
 ${box('left:404px;top:80px;width:792px;height:712px','<div class="panel" style="height:100%">'+h(2,'Postać','← →')+'<div style="margin-top:-6px">'+hero(S,300,52,true)+'</div><div style="margin-top:12px">'+roster(S,7)+'</div></div>')}
 ${box('left:1220px;top:80px;width:340px;height:712px','<div class="panel" style="height:100%;padding:16px 14px">'+h(3,'Moc palnika','')+burnList(S)+'</div>')}
 ${box('left:40px;right:40px;top:806px;height:76px',sumbar(S,start(S),'height:76px'))}`);
</script></body></html>
