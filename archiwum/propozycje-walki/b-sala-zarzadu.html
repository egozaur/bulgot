<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propozycja B: Sala Zarządu</title>
<link rel="stylesheet" href="wspolne.css">
<style>
/* ===== B: SALA ZARZĄDU: panel przycisków jak w windzie, Rosołowy Chlust wylewa się z wielkiego garnka ===== */
.bg{position:absolute;inset:0}.bg svg{width:100%;height:100%}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 50%,rgba(10,5,2,.65));z-index:5;pointer-events:none}

/* --- panel windy --- */
.panel{position:absolute;left:50%;bottom:3.4vh;transform:translateX(-50%);width:86vh;height:23.5vh;z-index:30;border-radius:2.4vh 2.4vh 1.2vh 1.2vh;
  background:linear-gradient(105deg,#9aa3b3 0%,#e5e9f1 18%,#aab2c2 36%,#dfe4ee 54%,#9ea7b8 74%,#d9dee9 100%);border:.35vh solid #1b1d26;box-shadow:0 1.2vh 3vh rgba(0,0,0,.55),inset 0 .3vh .4vh rgba(255,255,255,.7),inset 0 -.5vh 1vh rgba(0,0,0,.25)}
.panel:before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px);pointer-events:none}
.screw{position:absolute;width:1.1vh;height:1.1vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7b8396);border:.15vh solid #3a3f50}
.disp{position:absolute;left:50%;top:-2.6vh;transform:translateX(-50%);display:flex;align-items:center;gap:1.4vh;padding:.8vh 2.2vh;border-radius:1.2vh;background:#14090a;border:.3vh solid #1b1d26;box-shadow:0 .6vh 1.6vh rgba(0,0,0,.5);z-index:2}
.disp b{font:800 4.2vh/1 var(--mono);color:#ff4a2e;text-shadow:0 0 1.4vh #ff4a2e;letter-spacing:.1em}
.disp span{font:700 1.2vh var(--mono);color:#ffb59a;letter-spacing:.14em;line-height:1.35}
.lamps{display:flex;gap:.8vh}.lamps i{width:1.6vh;height:1.6vh;border-radius:50%;background:#3a1a14;border:.2vh solid #000}
.lamps i:nth-child(1){animation:l1 8s infinite}.lamps i:nth-child(2){animation:l2 8s infinite}
@keyframes l1{0%,24%{background:#3a1a14;box-shadow:none}25%,100%{background:#ffb347;box-shadow:0 0 1.4vh #ffb347}}
@keyframes l2{0%,35%{background:#3a1a14;box-shadow:none}36%,100%{background:#ffb347;box-shadow:0 0 1.4vh #ffb347}}
.btn{position:absolute;top:3.6vh;width:12.4vh;text-align:center}
.b1{left:calc(50% - 31vh - 6.2vh)}.b2{left:calc(50% - 6.2vh)}.b3{left:calc(50% + 31vh - 6.2vh)}
.btn .ring{position:relative;width:12.4vh;height:12.4vh;border-radius:50%;background:conic-gradient(var(--ringc,#ffb347) var(--p,360deg),#4a4f60 0);padding:.9vh;box-shadow:0 .5vh 0 #161822,0 0 var(--glow,0) var(--ringc,#ffb347)}
.btn .cap{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 36% 28%,#fdfdff,#bfc6d6 45%,#6f778b);border:.3vh solid #161822;display:grid;place-items:center;box-shadow:inset 0 -.6vh .8vh rgba(0,0,0,.28),0 .5vh .5vh rgba(0,0,0,.4)}
.btn .cap:before{content:"";position:absolute;inset:1.1vh;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2a2f43,#10131f);border:.2vh solid #000}
.btn .cap svg{position:relative;width:6.2vh;height:6.2vh;filter:drop-shadow(0 0 .4vh rgba(255,255,255,.35))}
.btn .no{position:absolute;left:-.6vh;top:-.6vh;width:3.2vh;height:3.2vh;border-radius:50%;background:#14090a;color:#ff4a2e;font:800 1.9vh/3.2vh var(--mono);text-shadow:0 0 .8vh #ff4a2e;border:.25vh solid #1b1d26;z-index:3}
.btn .lbl{margin:.9vh auto 0;width:16vh;margin-left:-1.8vh;padding:.5vh .6vh;border-radius:.7vh;background:linear-gradient(#2b2f40,#171a27);border:.2vh solid #0b0d15;color:#f3ead6;font:700 1.55vh/1.1 var(--disp);letter-spacing:.03em;box-shadow:inset 0 .2vh 0 rgba(255,255,255,.12)}
.btn .lbl small{display:block;font:700 1vh var(--mono);color:#9aa3c4;letter-spacing:.1em;margin-top:.3vh}
.btn .cap{transition:none}
.b1 .cap{animation:sink 8s infinite}.b1 .ring{animation:ring1 8s infinite}
@keyframes sink{0%,24%{transform:none}25.5%{transform:translateY(.7vh) scale(.94)}30%{transform:translateY(.3vh) scale(.97)}34%,100%{transform:none}}
@keyframes ring1{0%,24.5%{--p:360deg;--glow:2.2vh}25%{--p:360deg;--glow:5vh}25.1%{--p:0deg;--glow:5vh}30%{--glow:0}100%{--p:360deg;--glow:0}}
@property --p{syntax:'<angle>';inherits:true;initial-value:360deg}
@property --glow{syntax:'<length>';inherits:true;initial-value:0px}
.b2{--ringc:#7fe0ff}.b2 .ring{--p:360deg;--glow:2.4vh}
.b3{--ringc:#7dff9f}.b3 .ring{--p:150deg}

/* --- Rosołowy Chlust: garnek się przechyla i leje rosół na wszystkich --- */
#pot{position:absolute;left:66.9%;top:-4vh;width:46vh;height:34vh;z-index:21;transform-origin:30% 55%;animation:pot 8s infinite;opacity:0}
#pot svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1.4vh 1.4vh rgba(0,0,0,.45))}
@keyframes pot{0%,24%{opacity:0;transform:translateY(-44vh) rotate(0)}25%{opacity:1}29%{transform:translateY(0) rotate(0)}32%,43%{opacity:1;transform:translateY(1vh) rotate(-105deg)}49%{opacity:1;transform:translateY(-6vh) rotate(-20deg)}53%,100%{opacity:0;transform:translateY(-44vh) rotate(0)}}
#stream{position:absolute;left:72%;top:25vh;width:16vh;height:52vh;margin-left:-8vh;z-index:20;transform-origin:50% 0;opacity:0;animation:stream 8s infinite;
  clip-path:polygon(30% 0,70% 0,74% 40%,88% 100%,12% 100%,26% 40%)}
#stream i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(214,120,18,.0),#e08a1c 18%,#ffcf5a 46%,#ffe9a8 52%,#ffcf5a 58%,#e08a1c 82%,rgba(214,120,18,0));}
#stream i:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 4vh,rgba(255,255,255,.35) 4vh 5.2vh,transparent 5.2vh 9vh);animation:flow 1s linear infinite}
@keyframes flow{to{background-position:0 9vh}}
@keyframes stream{0%,31%{opacity:0;transform:scaleY(0)}33%{opacity:1;transform:scaleY(1)}43%{opacity:1;transform:scaleY(1) scaleX(1)}46%{opacity:1;transform:scaleY(1) scaleX(.55)}49%,100%{opacity:0;transform:scaleY(1) scaleX(.2)}}
.wave{position:absolute;left:73%;bottom:21.5vh;width:6vh;height:2.4vh;margin-left:-3vh;border-radius:50%;z-index:12;opacity:0;animation:wave 8s infinite;background:radial-gradient(ellipse at 50% 50%,rgba(255,196,66,.95),rgba(224,138,28,.7) 60%,transparent 72%)}
@keyframes wave{0%,33%{opacity:0;transform:scale(.3,.3)}35%{opacity:1;transform:scale(1,1)}44%{opacity:.9;transform:scale(8,4.4)}54%,100%{opacity:0;transform:scale(11,5.4)}}
.wave2{animation-delay:.18s;--x:1}
.drop{position:absolute;width:1.6vh;height:1.6vh;border-radius:50%;background:#ffcf5a;border:.2vh solid #8a4a00;z-index:23;opacity:0;animation:drop 8s infinite}
@keyframes drop{0%,33.5%{opacity:0;transform:translate(0,0)}34.5%{opacity:1}42%{opacity:1;transform:translate(var(--dx),var(--dy))}46%,100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 5vh))}}
.veg{position:absolute;z-index:23;opacity:0;animation:drop 8s infinite;font-size:3vh}
.steam{position:absolute;bottom:34vh;width:14vh;height:14vh;border-radius:50%;z-index:19;opacity:0;background:radial-gradient(rgba(255,255,255,.7),rgba(255,255,255,0) 68%);animation:steam 8s infinite;filter:blur(.8vh)}
@keyframes steam{0%,36%{opacity:0;transform:translateY(0) scale(.5)}42%{opacity:.8}60%{opacity:.35;transform:translateY(-20vh) scale(1.8)}72%,100%{opacity:0;transform:translateY(-26vh) scale(2.2)}}
.flame{position:absolute;z-index:24;width:6vh;height:6vh;opacity:0;animation:flame 8s infinite;transform-origin:50% 100%}
.flame svg{width:100%;height:100%;filter:drop-shadow(0 0 1vh #ff7a3d)}
@keyframes flame{0%,37%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.2)}43%,80%{opacity:1;transform:scale(1) translateY(-.4vh)}90%,100%{opacity:0}}
.hit{position:absolute;z-index:26;font-family:var(--disp);font-weight:700;font-size:4.6vh;color:#ffe9a8;text-shadow:0 .4vh 0 #7a3a00,0 0 1.6vh rgba(255,140,40,.9);opacity:0;animation:hit 8s infinite}
@keyframes hit{0%,35%{opacity:0;transform:translateY(0) scale(.5)}37%{opacity:1;transform:translateY(-1vh) scale(1.3)}41%{transform:translateY(-2.4vh) scale(1)}52%{opacity:1;transform:translateY(-7vh)}58%,100%{opacity:0;transform:translateY(-9vh)}}
.enemy .sprite{animation:bob 1.9s ease-in-out infinite,scald 8s infinite}
@keyframes scald{0%,35%{filter:none;transform:none}36.5%{filter:brightness(2.2) sepia(1) saturate(3);transform:translateX(1.6vh) scale(1.06,.95)}40%{filter:sepia(.7) saturate(2.6) hue-rotate(-12deg) brightness(1.05);transform:none}80%{filter:sepia(.7) saturate(2.6) hue-rotate(-12deg) brightness(1.05)}92%,100%{filter:none}}
.hero .sprite{animation:bob 1.6s ease-in-out infinite,cast 8s infinite!important}
@keyframes cast{0%,24%{transform:none}27%{transform:translateY(-2vh) scale(1.05,.96)}30%{transform:translateY(0)}100%{transform:none}}
.flash{position:absolute;inset:0;z-index:8;background:radial-gradient(ellipse at 70% 55%,rgba(255,190,80,.4),transparent 55%);opacity:0;animation:fl 8s infinite;pointer-events:none}
@keyframes fl{0%,33%{opacity:0}37%,48%{opacity:1}58%,100%{opacity:0}}
</style></head>
<body>
<div class="fs">
  <div class="bg" id="bg"></div>
  <div class="layer" id="units"></div><div class="flash"></div>
  <div class="layer" id="fx"></div>
  <div class="vig"></div>
  <div id="top"></div>
  <div class="panel" id="panel"></div>
  <div class="kron">„Garnek jest większy niż budżet na szkolenia.”</div>
  <div class="prop">PROPOZYCJA B · SALA ZARZĄDU</div>
</div>
<script type="module">
import {unit,st,topbar,icon,sname,hero,CAST,sti,freezeAt} from './wspolne.js';
const W=1920,H=1080,VY=480;
let s=11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
let sky='';for(let i=0;i<30;i++){const x=640+i*30,h=60+rnd()*210,w=22+rnd()*30;sky+=`<rect x="${x}" y="${440-h}" width="${w}" height="${h}" fill="${rnd()<.5?'#6f86b8':'#8aa0cf'}" opacity="${.5+rnd()*.5}"/>`}
const panels=(x0,x1)=>{let o='';for(let x=x0;x<x1;x+=70)o+=`<rect x="${x}" y="0" width="64" height="${VY}" fill="url(#wood)"/><rect x="${x+64}" y="0" width="6" height="${VY}" fill="#1a0e07"/>`;return o};
let floor='';for(let i=-14;i<=14;i++)floor+=`<line x1="960" y1="${VY}" x2="${960+i*300}" y2="${H}" stroke="#000" stroke-opacity=".18" stroke-width="2"/>`;
const chair=(x,y,sc)=>`<g transform="translate(${x} ${y}) scale(${sc})"><rect x="-26" y="-70" width="52" height="64" rx="14" fill="#2a1a12" stroke="#120a06" stroke-width="3"/><rect x="-30" y="-14" width="60" height="16" rx="6" fill="#3a2418"/></g>`;
document.getElementById('bg').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b3f22"/><stop offset=".5" stop-color="#8a5530"/><stop offset="1" stop-color="#5a3219"/></linearGradient>
 <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c110a"/><stop offset="1" stop-color="#4a2e1b"/></linearGradient>
 <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d1f24"/><stop offset="1" stop-color="#2b1013"/></linearGradient>
 <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa4e8"/><stop offset="1" stop-color="#d7e6fb"/></linearGradient>
 <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b57a45"/><stop offset=".5" stop-color="#6a3a1c"/><stop offset="1" stop-color="#2a150a"/></linearGradient>
 <radialGradient id="spot"><stop offset="0" stop-color="#ffe3a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe3a8" stop-opacity="0"/></radialGradient></defs>
 <rect width="${W}" height="${VY}" fill="#3a2314"/>${panels(0,640)}${panels(1300,1920)}
 <rect x="640" y="90" width="660" height="${VY-90}" fill="url(#sk)"/>${sky}
 ${[0,1,2,3,4].map(i=>`<rect x="${640+i*165-4}" y="90" width="8" height="${VY-90}" fill="#26180f"/>`).join('')}<rect x="636" y="86" width="668" height="10" fill="#26180f"/>
 <rect width="${W}" height="96" fill="url(#cl)"/>
 ${[250,620,990,1360,1730].map(x=>`<ellipse cx="${x}" cy="44" rx="70" ry="14" fill="#fff4d0"/><ellipse cx="${x}" cy="260" rx="190" ry="260" fill="url(#spot)" opacity=".28"/>`).join('')}
 <rect y="${VY}" width="${W}" height="${H-VY}" fill="url(#fl)"/>${floor}
 <ellipse cx="960" cy="800" rx="640" ry="190" fill="#7a2a31" opacity=".5"/><ellipse cx="960" cy="800" rx="560" ry="160" fill="none" stroke="#e7b35a" stroke-width="5" opacity=".6"/>
 <ellipse cx="960" cy="800" rx="440" ry="124" fill="none" stroke="#e7b35a" stroke-width="3" opacity=".45"/>
 <text x="960" y="812" text-anchor="middle" font-family="Baloo 2,Impact" font-weight="800" font-size="50" letter-spacing="10" fill="#e7b35a" opacity=".5">ROSOŁEX</text>
 ${[560,720,880,1040,1200,1360].map((x,i)=>chair(x,520,1)).join('')}
 <polygon points="360,${VY+26} 1560,${VY+26} 1640,${VY+110} 280,${VY+110}" fill="url(#tbl)" stroke="#1a0e07" stroke-width="4"/>
 <rect x="280" y="${VY+110}" width="1360" height="30" fill="#2a150a"/>
 <rect x="1380" y="130" width="360" height="220" rx="6" fill="#f3efe4" stroke="#1a0e07" stroke-width="6"/>
 <polyline points="1410,180 1480,200 1540,230 1610,270 1700,318" fill="none" stroke="#d6402b" stroke-width="8" stroke-linecap="round"/>
 <text x="1560" y="168" text-anchor="middle" font-family="Baloo 2,Impact" font-weight="800" font-size="26" fill="#1b1b22">WYNIKI Q3: ROSÓŁ</text>
 <text x="1560" y="338" text-anchor="middle" font-family="Consolas" font-weight="700" font-size="20" fill="#d6402b">−87% morale</text>
 <rect x="80" y="170" width="480" height="120" rx="6" fill="#1a0e07" stroke="#e7b35a" stroke-width="4"/>
 <text x="320" y="248" text-anchor="middle" font-family="Baloo 2,Impact" font-weight="800" font-size="40" letter-spacing="3" fill="#e7b35a">AWANS ALBO ROSÓŁ</text></svg>`;

document.getElementById('units').innerHTML=
 unit({id:'k',x:59,bottom:33,w:16,name:'Księgowy Kanarek',hp:37,max:37,svg:CAST.kanarek(),sts:st('burn',3)})+
 unit({id:'kot',x:90,bottom:30,w:20,name:'Kot Ochroniarz',hp:39,max:39,svg:CAST.kot(),sts:st('burn',3)})+
 unit({id:'sep',x:74,bottom:24,w:28,name:'Sęp Audytor',hp:38,max:55,svg:CAST.sep(),sts:st('burn',3)})+
 unit({id:'h',cls:'hero',x:21,bottom:26,w:29,name:'Pyrtek',hp:88,max:100,svg:hero()});
document.getElementById('top').innerHTML=topbar();

const potSvg=`<svg viewBox="0 0 460 340"><ellipse cx="230" cy="316" rx="150" ry="14" fill="#000" opacity="0"/>
 <path d="M70 120 H390 V260 Q390 318 330 318 H130 Q70 318 70 260Z" fill="#aab3c4" stroke="#2b1a12" stroke-width="10" stroke-linejoin="round"/>
 <path d="M96 150 H150 V300 H130 Q96 300 96 262Z" fill="#fff" opacity=".35"/>
 <ellipse cx="230" cy="120" rx="160" ry="34" fill="#4c566b" stroke="#2b1a12" stroke-width="10"/>
 <ellipse cx="230" cy="122" rx="138" ry="24" fill="#e08a1c"/><ellipse cx="230" cy="120" rx="112" ry="16" fill="#ffcf5a"/>
 <circle cx="200" cy="118" r="9" fill="#ff9a2e" stroke="#8a4a00" stroke-width="3"/><circle cx="262" cy="124" r="7" fill="#ff9a2e" stroke="#8a4a00" stroke-width="3"/>
 <path d="M70 170 H20 Q2 170 2 188 V210 Q2 228 20 228 H70" fill="none" stroke="#2b1a12" stroke-width="22" stroke-linecap="round"/>
 <path d="M70 170 H20 Q2 170 2 188 V210 Q2 228 20 228 H70" fill="none" stroke="#6b3f22" stroke-width="10" stroke-linecap="round"/>
 <path d="M390 170 H440 Q458 170 458 188 V210 Q458 228 440 228 H390" fill="none" stroke="#2b1a12" stroke-width="22" stroke-linecap="round"/>
 <path d="M390 170 H440 Q458 170 458 188 V210 Q458 228 440 228 H390" fill="none" stroke="#6b3f22" stroke-width="10" stroke-linecap="round"/>
 <text x="230" y="250" text-anchor="middle" font-family="Baloo 2,Impact" font-weight="800" font-size="46" fill="#d6402b" stroke="#2b1a12" stroke-width="2">ROSÓŁ XL</text></svg>`;
const fl=`<svg viewBox="0 0 24 24">${'' }</svg>`;
const flame=(x,y,d)=>`<div class="flame" style="left:${x}%;bottom:${y}vh;animation-delay:${d}s">${sti('burn')}</div>`;
const drops=[[ -9,-6],[ 10,-9],[ -14,-2],[ 15,-4],[ -4,-12],[ 6,-13],[ 20,-8],[ -18,-9]].map(([dx,dy],i)=>`<i class="drop" style="left:${73+dx*.6}%;bottom:25vh;--dx:${dx*1.1}vh;--dy:${-dy*1.6}vh;animation-delay:${i*.03}s"></i>`).join('');
const veg=[['🥕',-7,-8],['🍜',9,-10],['🥕',16,-5],['🧅',-13,-6]].map(([e,dx,dy],i)=>`<span class="veg" style="left:${74+dx*.4}%;bottom:26vh;--dx:${dx*1.2}vh;--dy:${-dy*1.5}vh;animation-delay:${i*.05}s">${e}</span>`).join('');
document.getElementById('fx').innerHTML=`
 <div id="pot">${potSvg}</div><div id="stream"><i></i></div>
 <div class="wave" style="left:74%"></div><div class="wave wave2" style="left:74%"></div>${drops}${veg}
 <div class="steam" style="left:70%"></div><div class="steam" style="left:78%;animation-delay:.3s"></div><div class="steam" style="left:58%;animation-delay:.5s"></div><div class="steam" style="left:89%;animation-delay:.2s"></div>
 ${flame(58,36,.0)}${flame(75,36,.06)}${flame(90.5,36,.12)}
 <div class="hit" style="left:55.2%;bottom:43vh">19</div><div class="hit" style="left:70%;bottom:46vh;animation-delay:.05s">24</div><div class="hit" style="left:87%;bottom:44vh;animation-delay:.1s">19</div>`;

const btn=(n,sk,lvl)=>`<div class="btn b${n}"><div class="no">${n}</div><div class="ring"><div class="cap">${icon(sk)}</div></div><div class="lbl">${sname(sk)}<small>${lvl}</small></div></div>`;
document.getElementById('panel').innerHTML=`
 <i class="screw" style="left:1.4vh;top:1.4vh"></i><i class="screw" style="right:1.4vh;top:1.4vh"></i><i class="screw" style="left:1.4vh;bottom:1.4vh"></i><i class="screw" style="right:1.4vh;bottom:1.4vh"></i>
 <div class="disp"><b>14</b><span>OKNO<br>GDAKANIA</span><div class="lamps"><i></i><i></i><i></i></div></div>
 ${btn(1,'chlust','poz. ★ · odnawia')}${btn(2,'lodowy','poz. ★★ · GOTOWY')}${btn(3,'pogotowie','poz. ★ · odnawia')}`;
freezeAt();
</script>
</body></html>
