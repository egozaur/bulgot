<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 Kreator krok po kroku</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap">
<link rel="stylesheet" href="wspolne.css">
<style>
.t{position:absolute;left:44px;top:22px;font-size:44px;color:var(--amber);text-shadow:0 3px 0 var(--outline)}
.steps{position:absolute;left:44px;right:44px;top:100px;bottom:130px;display:flex;gap:18px}
.st{position:relative;border-radius:26px;border:2px solid var(--line);background:linear-gradient(var(--panel),#1b140f);overflow:hidden;transition:.2s}
.st.col{width:270px;text-align:center;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.st.col:hover{border-color:var(--amber)}
.st.act{flex:1;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,71,.18),0 0 40px rgba(255,150,40,.12);padding:20px 26px}
.num{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;background:#3a2b1c;border:3px solid var(--outline);color:var(--muted)}
.act .num{background:var(--amber);color:#2b1a12}.done .num{background:var(--green);color:#14301a}
.st h4{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.st.col .v{font-family:var(--display);font-size:34px;line-height:1;color:var(--ink)}.st.col .s{font-size:14px;color:var(--muted)}
.st.col .egg-art{width:170px;height:186px}.st.col .bart{width:190px;height:160px}
.chg{margin-top:auto;font-size:13px;color:var(--amber);border:1px solid var(--line);border-radius:10px;padding:3px 12px}
.st.col.soon{opacity:.62}
.ah{display:flex;align-items:center;gap:14px;margin-bottom:12px}.ah h3{font-size:36px;color:var(--amber)}.ah small{color:var(--muted);font-size:15px}
.body{display:flex;gap:26px}
.gridc{width:600px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-content:start}
.cd{position:relative;border-radius:16px;border:3px solid var(--outline);background:var(--panel2);padding:6px 4px 8px;text-align:center;opacity:.85;transition:.12s}
.cd .egg-art{width:96px;height:106px;margin:0 auto}.cd b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.05;margin-top:2px}.cd small{font-size:11px;color:var(--faint)}
.cd:hover{opacity:1}.cd.on{opacity:1;border-color:var(--amber);background:#3a2b1c;box-shadow:0 0 22px rgba(255,160,40,.35);transform:translateY(-3px)}.cd.on b{color:var(--amber)}
.cd.lk{filter:grayscale(.8) brightness(.75)}.cd.lk::after{content:'🔒';position:absolute;right:5px;top:3px;font-size:15px}
.det{flex:1;text-align:center}
.det .pic{width:230px;height:252px;margin:0 auto;filter:drop-shadow(0 18px 22px #000)}.det .pic .egg-art{width:100%;height:100%}
.det h2{font-size:42px;color:var(--amber);line-height:1}.det .sub{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:14px;margin:2px 0 10px}
.det .pk{margin-bottom:6px;font-size:15px;text-align:left}
.bar{position:absolute;left:44px;right:44px;bottom:26px;display:flex;align-items:center;justify-content:space-between}
.sum{font-size:19px;color:var(--muted)}.sum b{font-family:var(--display);font-weight:400;color:var(--ink);font-size:26px}
.nx{display:flex;gap:14px;align-items:center}.nx .ghost{padding:12px 24px;border-radius:14px;border:2px solid var(--line);color:var(--muted);font-family:var(--display);font-size:22px}
.prog{position:absolute;left:44px;right:44px;top:80px;height:5px;border-radius:3px;background:#2a2018}.prog i{display:block;height:100%;width:50%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--amber))}
</style></head><body><div id="root"></div>
<script type="module">
import {art,D,T,S,CH,GARNEK,MODES,BURNERS,HEAT,MAX_BURNER,egg,bart,perks,mount} from "./wspolne.js";
mount(S=>{ const c=CH[S.cur], g=GARNEK[S.burner], m=MODES[S.mode], ok=c.open&&g.open;
 return `<h1 class="t">Nowy run</h1><button class="back" style="left:auto;right:44px;top:30px">← Menu</button><div class="prog"><i></i></div>
 <div class="steps">
  <section class="st col done" data-set="mode:${S.mode==='full'?'quick':'full'}" title="Kliknij, by zmienić"><div class="num">✓</div><h4>Tryb</h4><div class="v">${m.name}</div><div class="s">${m.floors} pięter<br>${m.bosses} bossów<br>ok. ${m.min} min</div><div style="margin:12px 0;width:100%">${Array.from({length:m.floors},(_,i)=>`<i style="display:inline-block;width:${m.floors>10?8:16}px;height:10px;margin:1px;border-radius:2px;background:${m.bf.includes(i+1)?'var(--red)':'var(--amber)'}"></i>`).join('')}</div><span class="chg">zmień na ${S.mode==='full'?'Szybki':'Pełny'}</span></section>
  <section class="st act"><div class="ah"><div class="num">2</div><h3>Wybierz postać</h3><small>← → · ${CH.filter(x=>x.open).length} z ${CH.length} odblokowanych</small></div>
   <div class="body"><div class="gridc">${CH.map((x,i)=>`<button class="cd ${i===S.cur?'on':''} ${x.open?'':'lk'}" data-set="cur:${i}">${egg(x.id)}<b>${x.name}</b><small>${x.style}</small></button>`).join('')}</div>
   <div class="det"><div class="pic">${egg(c.id)}</div><h2>${c.name}</h2><div class="sub">${c.style}</div>${c.open?perks(c.id):`<div class="pk"><span>🔒 ${c.hidden?'Zagadka.':c.unlock}</span></div>`}</div></div></section>
  <section class="st col soon" style="--c:${g.heat}"><div class="num">3</div><h4>Poziom palnika</h4>${bart(g.lvl)}<div class="v" style="color:${g.heat}">${g.name}</div><div class="s">${g.mod}<br>wynik ×${g.mult}</div><div style="display:flex;gap:4px;margin-top:6px">${GARNEK.map(x=>`<i style="width:22px;height:8px;border-radius:2px;background:${x.lvl<=S.burner?x.heat:'#4a3a2a'}"></i>`).join('')}</div><span class="chg">następny krok</span></section>
 </div>
 <div class="bar"><div class="sum">${m.name} · <b>${c.name}</b> · <b style="color:${g.heat}">${g.name}</b></div><div class="nx"><span class="ghost">← Wróć</span><button class="go" ${c.open?'':'disabled'}>Dalej: palnik →</button></div></div>`;});
</script></body></html>
